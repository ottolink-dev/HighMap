<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" font-family="sans-serif" font-size="12">
  <rect x="0" y="0" width="420" height="240" fill="#ffffff"/>
  <text x="210" y="22" text-anchor="middle" font-weight="bold" fill="#222">BBox2D (Axis-Aligned World Space)</text>

  <!-- Axes -->
  <line x1="60" y1="205" x2="380" y2="205" stroke="#888" stroke-width="1.5"/>
  <line x1="60" y1="205" x2="60" y2="35" stroke="#888" stroke-width="1.5"/>
  <text x="386" y="209" fill="#555">+X</text>
  <text x="56" y="28" text-anchor="middle" fill="#555">+Y</text>

  <!-- BBox rectangle -->
  <rect x="110" y="65" width="220" height="110" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="220" y="124" text-anchor="middle" font-weight="bold" fill="#1b5e20">BBox2D</text>

  <!-- Projection guides -->
  <line x1="110" y1="175" x2="110" y2="205" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="330" y1="175" x2="330" y2="205" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="60" y1="175" x2="110" y2="175" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="60" y1="65" x2="110" y2="65" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Labels -->
  <text x="110" y="222" text-anchor="middle" fill="#2e7d32">xmin</text>
  <text x="330" y="222" text-anchor="middle" fill="#2e7d32">xmax</text>
  <text x="52" y="179" text-anchor="end" fill="#2e7d32">ymin</text>
  <text x="52" y="69" text-anchor="end" fill="#2e7d32">ymax</text>
</svg>
