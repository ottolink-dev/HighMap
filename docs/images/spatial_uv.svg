<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" font-family="sans-serif" font-size="12">
  <rect x="0" y="0" width="420" height="240" fill="#ffffff"/>
  <text x="210" y="22" text-anchor="middle" font-weight="bold" fill="#222">UV Space [0, 1]²</text>

  <!-- Grid -->
  <rect x="90" y="40" width="240" height="160" fill="#f4f7fb" stroke="#2c5aa0" stroke-width="2"/>
  <line x1="210" y1="40" x2="210" y2="200" stroke="#2c5aa0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="90" y1="120" x2="330" y2="120" stroke="#2c5aa0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Tile labels -->
  <text x="150" y="76" text-anchor="middle" fill="#1a3b6e" font-weight="bold">Tile (0, 1)</text>
  <text x="150" y="92" text-anchor="middle" fill="#4a6fa5" font-size="11">UvRect</text>

  <text x="270" y="76" text-anchor="middle" fill="#1a3b6e" font-weight="bold">Tile (1, 1)</text>
  <text x="270" y="92" text-anchor="middle" fill="#4a6fa5" font-size="11">UvRect</text>

  <text x="150" y="156" text-anchor="middle" fill="#1a3b6e" font-weight="bold">Tile (0, 0)</text>
  <text x="150" y="172" text-anchor="middle" fill="#4a6fa5" font-size="11">UvRect</text>

  <text x="270" y="156" text-anchor="middle" fill="#1a3b6e" font-weight="bold">Tile (1, 0)</text>
  <text x="270" y="172" text-anchor="middle" fill="#4a6fa5" font-size="11">UvRect</text>

  <!-- Corner coordinates -->
  <text x="82" y="204" text-anchor="end" fill="#444">(0, 0)</text>
  <text x="338" y="204" text-anchor="start" fill="#444">(1, 0)</text>
  <text x="82" y="44" text-anchor="end" fill="#444">(0, 1)</text>
  <text x="338" y="44" text-anchor="start" fill="#444">(1, 1)</text>
  <text x="82" y="124" text-anchor="end" fill="#666" font-size="11">(0, 0.5)</text>
  <text x="210" y="220" text-anchor="middle" fill="#666" font-size="11">(0.5, 0)</text>
</svg>
